name: Daily Schedule Check

on:
  schedule:
    # Изпълнява се всяка вечер в 20:05 ч. (17:05 UTC лятно време / 18:05 UTC зимно време)
    - cron: '5 17,18 * * *'
  workflow_dispatch: # Позволява ръчно стартиране с 1 клик за тест

permissions:
  contents: write

jobs:
  check-schedule:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check for schedule changes
        env:
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          GITHUB_PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python check_schedule.py

      - name: Commit and push changes
        if: env.SCHEDULE_CHANGED == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add schedule_hash.txt latest_schedule.pdf index.html
          git commit -m "Update schedule from TU-Sofia [skip ci]" || echo "No changes to commit"
          git push
